[project]
name = "local-rag"
version = "0.1.0"
description = "Small project with a local RAG using open-source models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.13.0",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.1",
    "pydantic-settings>=2.13.1",
    "pypdf>=6.9.2",
    "python-multipart>=0.0.22",
    "qdrant-client>=1.17.1",
    "sentence-transformers>=5.3.0",
    "streamlit>=1.55.0",
    "tiktoken>=0.12.0",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.7",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # warnings
    "F", # pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "I", # isort
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "N" # pep8-naming
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "ui"]

[tool.mypy]
python_version = "3.14"
strict = true # Explicit types everywhere
ignore_missing_imports = true
exclude = ["tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
